# ── Air Quality Sensor (ESP32 via Mosquitto) ──────────────────────────────────
[[inputs.mqtt_consumer]]
  servers       = ["tcp://mosquitto:1883"]
  topics        = ["air/#"]
  data_format   = "json"

# ── Bambu Lab Printer (direct SSL connection) ──────────────────────────────────
# Replace with your printer's IP, serial number, and access code
[[inputs.mqtt_consumer]]
  servers              = ["ssl://YOUR_PRINTER_IP:8883"]
  topics               = ["device/YOUR_PRINTER_SERIAL/report"]
  username             = "bblp"
  password             = "YOUR_PRINTER_ACCESS_CODE"
  data_format          = "json"
  insecure_skip_verify = true
  name_override        = "bambu"

# ── InfluxDB v2 Output ────────────────────────────────────────────────────────
[[outputs.influxdb_v2]]
  urls         = ["http://influxdb:8086"]
  token        = "YOUR_INFLUXDB_TOKEN"
  organization = "YOUR_INFLUXDB_ORG"
  bucket       = "YOUR_INFLUXDB_BUCKET"
